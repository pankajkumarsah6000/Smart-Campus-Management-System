server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: smart-campus-backend

  datasource:
    url: ${DB_URL:jdbc:h2:mem:smartcampus;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-minimum-256-bits-long-please}
    access-token-expiration-ms: ${JWT_ACCESS_EXP:3600000}      # 1 hour
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP:604800000}  # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    provider-api-key: ${AI_PROVIDER_API_KEY:}
    provider-base-url: ${AI_PROVIDER_BASE_URL:https://api.anthropic.com/v1/messages}
    model: ${AI_MODEL:claude-sonnet-4-6}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.smartcampus: ${LOG_LEVEL:INFO}


